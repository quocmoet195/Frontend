    <section class="content">
        <div class="content_left">
            <caption>Таблица о студентом</caption>
            <table class="main-table">
                <tr class="header-table">
                    <th width="10%"> ID</th>
                    <th width="20%"> ФИО</th>
                    <th width="20%"> Номер группы</th>
                    <th width="10%"> Пол</th>
                    <th width="10%"> Возраст</th>
                </tr>
                <tr class="text-table row-1">
                    <td>1</td>
                    <td>Новиков Л.Д</td>
                    <td>6111</td>
                    <td>Муж</td>
                    <td>18</td>
                </tr>
                <tr class="text-table row-2">
                    <td>2 </td>
                    <td>Петров К.О.</td>
                    <td>2116</td>
                    <td> Муж</td>
                    <td>19 </td>
                </tr>
                <tr class="text-table row-3">
                    <td>3 </td>
                    <td>Сидоров И.Н.</td>
                    <td>4131 </td>
                    <td>Муж </td>
                    <td> 17</td>
                </tr>
                <tr class="text-table row-4">
                    <td>4 </td>
                    <td>Вольская О.А.</td>
                    <td>6111 </td>
                    <td>Женщина</td>
                    <td> 19</td>
                </tr>
                <tr class="text-table row-5">
                    <td>5 </td>
                    <td>Уткина Е.В.</td>

                    <td> 6224</td>
                    <td> Муж</td>
                    <td>20</td>
                </tr>
            </table>
        </div>
        
        <div class="content_right">
            <form id="studentForm" class="studentForm">
                <h3>Добавить студент</h3>
                <input placeholder="ID" type="number" id="studentId" name="studentId" required>

                <input  placeholder="ФИО" type="text" id="studentName" name="studentName" required>

                <input  placeholder="Номер группы" type="text" id="groupNumber" name="groupNumber" required>

                <select  placeholder="Пол" id="gender" name="gender" required>
                    <option value="">Пол</option>
                    <option value="Муж">Муж</option>
                    <option value="Жен">Жен</option>
                </select>

                <input  placeholder="Возраст" type="number" id="age" name="age" required>

                <button class="button" type="button" onclick="addStudent()">Добавить</button>
            </form>

        </div>

    </section>





</body>
